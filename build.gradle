plugins {
  id 'java'
  id 'maven-publish'
  id "com.github.node-gradle.node" version "7.1.0"
  id "no.item.xp.codegen" version "3.0.0-SNAPSHOT"
  id 'com.enonic.xp.base'
}

dependencies {
  // Libraries the JavaScript sources require at runtime. Declared as implementation so they
  // land in the published POM, and apps that include this library pick them up transitively.
  implementation xplibs.portal
  implementation "com.enonic.lib:lib-http-client:4.0.1"
}

repositories {
  mavenCentral()
  xp.enonicRepo()
}

node {
  // GitHub Actions sets CI, and has already installed Node with setup-node
  download = !System.getenv("CI")
  // Single source of truth for the Node version, shared with .github/workflows and nvm
  version = file(".nvmrc").text.trim()
  // In CI the build fails on a package-lock.json that has drifted from package.json,
  // which a plain `npm install` would silently repair
  npmInstallCommand = System.getenv("CI") ? "ci" : "install"
}

processResources {
  exclude "**/.gitkeep"
  exclude "**/*.json"
  exclude "**/*.ts"
}

tasks.register("dev", Exec) {
  if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
    commandLine "cmd", "/c", "gradlew.bat", "deploy", "-t"
  } else {
    commandLine "./gradlew", "deploy", "-t"
  }
}

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    "build"
  ]
  dependsOn npmInstall, generateTypeScript
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString()
  ]
  inputs.dir "src/main/resources"
  outputs.dir "build/resources/main"
  outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

compileTestJava.dependsOn npmBuild

tasks.register("npmCheck", NpmTask) {
  dependsOn npmInstall, generateTypeScript
  args = [
    "run",
    "check"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
}

check.dependsOn npmCheck

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      // Only stable versions reach the releases repository: a changesets prerelease (1.0.0-beta.0 on npm) is versioned
      // 1.0.0-SNAPSHOT here by .changeset/gradle-version.mjs
      url = version.endsWith("SNAPSHOT")
        ? "https://repo.itemtest.no/snapshots"
        : "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    mavenJava(MavenPublication) {
      from components.java
      groupId = project.group
      artifactId = projectName
      version = project.version
    }
  }
}
